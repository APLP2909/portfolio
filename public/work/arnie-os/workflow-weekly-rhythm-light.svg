<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" id="arnie-flow-weekly">
<title id="t">Weekly rhythm</title>
<desc id="d">Animated workflow of my weekly rhythm in two parts. Every Friday Eminem reads the prior Hub pilot reports, pulls Tableau data and Jira initiatives, computes signals and RAG status, then drafts suggested values and three report formats. I review before anything is filed, and Eminem then files the three reports to Slite. Oprah's end-of-week reflection covers completed, deferred and open items and hands a carry-forward package to Monica, who updates the backlog, reschedules carry-forwards and flags risks.</desc>
