<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" id="arnie-flow-escalation">
<title id="t">Escalation routing</title>
<desc id="d">Animated workflow of escalation routing. Every agent escalates to Oprah first, for example Paddington when a threshold is breached. Oprah's escalation framework routes each escalation to a tier: L3 interrupts me, L2 is flagged for today and L1 is queued.</desc>
<style>
text{font-family:"IBM Plex Sans",system-ui,sans-serif;fill:#e6edf2}
.ttl{font:700 20px "Archivo","IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.01em}
.eyebrow{font:500 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;fill:#9aa7b2}
.tile{font:700 16px "Archivo","IBM Plex Sans",system-ui,sans-serif;fill:#38e1d0}
