.small{font:400 15px "IBM Plex Sans",system-ui,sans-serif}
.lab{font:500 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;fill:#9aa7b2}
#cam{animation:cam 12.0s linear infinite}
.cap-static{opacity:0}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 #cam{transform:translate(30px,80px) scale(0.7)}
 .cap{opacity:0!important}
 .cap-static{opacity:1}
}
