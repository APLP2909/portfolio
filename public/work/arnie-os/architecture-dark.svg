<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" id="arnie-architecture">
<title id="t">Arnie OS architecture</title>
<desc id="d">Diagram of Arnie OS. I sit at the top and decide and approve. Oprah, the chief of staff, is the escalation router and decides whether to interrupt me or queue an item. Nine specialist agents sit below her: Wade for communication, Paddington for customer advocacy, Angela for market intelligence, Monica for planning, Jacinda for people, Lisa as analyst, Eminem for narrative, Tony for product creation and Shuri for research. Wade, Eminem and Tony wait for my approval. The agents read from connected tools including Gmail, Slack, Google Calendar, Jira, Slite, Tableau, Mixpanel, Dovetail, HubSpot, Intercom, Figma, Miro, Google Drive and web search. Mary, the knowledge organiser, files their outputs into the Slite collections.</desc>
