<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" id="arnie-flow-triage">
<title id="t">Inbox triage to approval</title>
<desc id="d">Animated workflow of Wade's inbox triage. Wade monitors Gmail, Slack, document comments and Miro comments and triages each item. Triaged items are filed by Mary to OS Actions with the status Pending approval. Customer feedback goes to Paddington. A reply is drafted in my voice, and every outgoing message needs my explicit approval before it leaves.</desc>
